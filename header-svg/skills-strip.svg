<svg width="100%" height="110" viewBox="0 0 1020 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chip { font-family: Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1020" height="110" rx="14" fill="#0d1117"/>

  <g>
    <rect x="20" y="30" width="120" height="50" rx="10" fill="#02569B">
      <animate attributeName="y" values="30;25;30" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="60" text-anchor="middle" class="chip">Flutter</text>
  </g>

  <g>
    <rect x="155" y="30" width="120" height="50" rx="10" fill="#3DDC84">
      <animate attributeName="y" values="30;25;30" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <text x="215" y="60" text-anchor="middle" class="chip" fill="#0d1117">Android</text>
  </g>

  <g>
    <rect x="290" y="30" width="100" height="50" rx="10" fill="#111111">
      <animate attributeName="y" values="30;25;30" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="60" text-anchor="middle" class="chip">iOS</text>
  </g>

  <g>
    <rect x="405" y="30" width="120" height="50" rx="10" fill="#339933">
      <animate attributeName="y" values="30;25;30" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <text x="465" y="60" text-anchor="middle" class="chip">Node.js</text>
  </g>

  <g>
    <rect x="540" y="30" width="130" height="50" rx="10" fill="#404040">
      <animate attributeName="y" values="30;25;30" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="605" y="60" text-anchor="middle" class="chip">Express.js</text>
  </g>

  <g>
    <rect x="685" y="30" width="120" height="50" rx="10" fill="#092E20">
      <animate attributeName="y" values="30;25;30" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="745" y="60" text-anchor="middle" class="chip">Django</text>
  </g>

  <g>
    <rect x="820" y="30" width="110" height="50" rx="10" fill="#714B67">
      <animate attributeName="y" values="30;25;30" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="875" y="60" text-anchor="middle" class="chip">Odoo</text>
  </g>
</svg>
