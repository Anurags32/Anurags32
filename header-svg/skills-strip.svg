<svg width="100%" height="120" viewBox="0 0 1040 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#04060F"/>
      <stop offset="50%"  stop-color="#090D1C"/>
      <stop offset="100%" stop-color="#060416"/>
    </linearGradient>
    <linearGradient id="sb2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="33%"  stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="66%"  stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="sg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .ct { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #fff; }
      .cs { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1040" height="120" rx="18" fill="url(#sb)" stroke="url(#sb2)" stroke-width="1.4"/>
  <rect width="1040" height="120" rx="18" fill="url(#sg)"/>

  <!-- Flutter -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3.2s" repeatCount="indefinite"/>
    <rect x="22" y="28" width="132" height="62" rx="14" fill="#023e6e" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.4"/>
    <path d="M 42 74 L 54 86 L 66 74 L 54 62 Z" fill="#38BDF8" transform="scale(0.72) translate(15, -3)"/>
    <path d="M 54 62 L 68 48 L 60 48 L 46 62 Z" fill="#0284C7" transform="scale(0.72) translate(15, -3)"/>
    <text x="84" y="57" font-size="14" text-anchor="middle" class="ct">Flutter</text>
    <text x="84" y="76" font-size="10" text-anchor="middle" class="cs" fill="#7dd3fc">Dart · BLoC · Riverpod</text>
  </g>

  <!-- Android / Kotlin -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="3.5s" repeatCount="indefinite"/>
    <rect x="168" y="28" width="142" height="62" rx="14" fill="#033729" fill-opacity="0.5" stroke="#3DDC84" stroke-width="1.4"/>
    <path d="M 188 60 C 188 54 192 50 197 50 C 202 50 206 54 206 60 Z" fill="#3DDC84"/>
    <line x1="191" y1="51" x2="188" y2="46" stroke="#3DDC84" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="203" y1="51" x2="206" y2="46" stroke="#3DDC84" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="193.5" cy="56" r="1.3" fill="#022518"/>
    <circle cx="200.5" cy="56" r="1.3" fill="#022518"/>
    <text x="252" y="57" font-size="14" text-anchor="middle" class="ct" fill="#3DDC84">Android</text>
    <text x="252" y="76" font-size="10" text-anchor="middle" class="cs" fill="#86efac">Kotlin · Jetpack Compose</text>
  </g>

  <!-- iOS / Swift -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.9s" repeatCount="indefinite"/>
    <rect x="324" y="28" width="130" height="62" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#FA7343" stroke-width="1.4"/>
    <text x="354" y="68" font-size="22" text-anchor="middle"></text>
    <text x="408" y="57" font-size="14" text-anchor="middle" class="ct">Swift</text>
    <text x="408" y="76" font-size="10" text-anchor="middle" class="cs" fill="#fdba74">iOS · SwiftUI · UIKit</text>
