    <rect x="468" y="28" width="135" height="62" rx="14" fill="#0a3322" fill-opacity="0.5" stroke="#22c55e" stroke-width="1.4"/>
    <text x="498" y="68" font-size="22" text-anchor="middle">🟢</text>
