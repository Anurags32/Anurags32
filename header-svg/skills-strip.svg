    <rect x="617" y="28" width="138" height="62" rx="14" fill="#12104f" fill-opacity="0.5" stroke="#818cf8" stroke-width="1.4"/>
    <text x="647" y="68" font-size="22" text-anchor="middle">⚡</text>
    <text x="707" y="57" font-size="14" text-anchor="middle" class="ct">Express</text>
    <text x="707" y="76" font-size="10" text-anchor="middle" class="cs" fill="#c7d2fe">Middleware · Microservice</text>
  </g>

  <!-- Django -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="3.3s" repeatCount="indefinite"/>
    <rect x="769" y="28" width="130" height="62" rx="14" fill="#033729" fill-opacity="0.45" stroke="#34d399" stroke-width="1.4"/>
    <text x="799" y="68" font-size="22" text-anchor="middle">🐍</text>
    <text x="857" y="57" font-size="14" text-anchor="middle" class="ct">Django</text>
    <text x="857" y="76" font-size="10" text-anchor="middle" class="cs" fill="#6ee7b7">ORM · DRF · Python</text>
  </g>

  <!-- Odoo ERP -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3.0s" repeatCount="indefinite"/>
    <rect x="913" y="28" width="108" height="62" rx="14" fill="#37115a" fill-opacity="0.5" stroke="#c084fc" stroke-width="1.4"/>
    <text x="935" y="68" font-size="22" text-anchor="middle">🧩</text>
    <text x="967" y="57" font-size="13" text-anchor="middle" class="ct">Odoo ERP</text>
    <text x="967" y="76" font-size="9" text-anchor="middle" class="cs" fill="#d8b4fe">Modules · PostgreSQL</text>
