<svg width="100%" height="280" viewBox="0 0 950 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Mesh Gradient -->
    <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="35%" stop-color="#0b0f19"/>
      <stop offset="70%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillMobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="pillBackend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="pillErp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <style>
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.8px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .status-text {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #34D399;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="950" height="280" rx="20" fill="url(#bgMesh)"/>

  <!-- Background Ambient Glows -->
  <circle cx="150" cy="70" r="100" fill="#06B6D4" opacity="0.15" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="200" r="120" fill="#8B5CF6" opacity="0.18" filter="url(#glowPurple)">
    <animate attributeName="opacity" values="0.15;0.26;0.15" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="800;770;800" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Futuristic Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="56" x2="950" y2="56"/>
    <line x1="0" y1="112" x2="950" y2="112"/>
    <line x1="0" y1="168" x2="950" y2="168"/>
    <line x1="0" y1="224" x2="950" y2="224"/>
    <line x1="135" y1="0" x2="135" y2="280"/>
    <line x1="270" y1="0" x2="270" y2="280"/>
    <line x1="405" y1="0" x2="405" y2="280"/>
    <line x1="545" y1="0" x2="545" y2="280"/>
    <line x1="680" y1="0" x2="680" y2="280"/>
    <line x1="815" y1="0" x2="815" y2="280"/>
  </g>

  <!-- Floating Sparkles / Tech Nodes -->
  <circle cx="80" cy="80" r="2" fill="#38BDF8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="70" r="2.5" fill="#C084FC">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="220" r="2" fill="#34D399">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="210" r="2" fill="#818CF8">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Glassmorphic Outer Card -->
  <rect x="25" y="20" width="900" height="240" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.2"/>

  <!-- Scanning Laser Line -->
  <line x1="50" y1="20.5" x2="250" y2="20.5" stroke="url(#laserGrad)" stroke-width="2">
    <animate attributeName="x1" values="30;720;30" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="230;920;230" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Corner Brackets -->
  <path d="M 36 34 L 36 28 L 44 28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 914 34 L 914 28 L 906 28" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 246 L 36 252 L 44 252" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 914 246 L 914 252 L 906 252" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>

  <!-- Status Pill -->
  <g transform="translate(475, 52)">
    <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#030712" stroke="#1E293B" stroke-width="1"/>
    <circle cx="-62" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="4" class="status-text" text-anchor="middle">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Hero Name -->
  <text x="475" y="116" class="hero-name" fill="url(#heroTextGrad)" text-anchor="middle">
    ANURAG TIWARI
  </text>

  <!-- Role Subtitle -->
  <text x="475" y="152" class="hero-sub" text-anchor="middle">
    Mobile Application Architect • Backend Engineer • ERP Consultant
  </text>

  <!-- Tech Focus Badges (Mobile, Backend, ERP) -->
  <g transform="translate(475, 205)">
    <!-- Badge 1: Mobile App Dev -->
    <g transform="translate(-290, 0)">
      <rect x="0" y="-16" width="175" height="32" rx="10" fill="url(#pillMobile)" stroke="#0284c7" stroke-width="1.2"/>
      <!-- Android/Apple Mini Vector Icon -->
      <path d="M 18 -4 C 18 -7 20 -9 23 -9 C 26 -9 28 -7 28 -4 Z" fill="#38BDF8"/>
      <circle cx="21" cy="-4.5" r="0.8" fill="#030712"/>
      <circle cx="25" cy="-4.5" r="0.8" fill="#030712"/>
      <rect x="18" y="-3" width="10" height="8" rx="2" fill="#38BDF8"/>
      <text x="100" y="4.5" fill="#BAE6FD" class="pill-label" text-anchor="middle">Flutter • iOS • Android</text>
    </g>

    <!-- Badge 2: Backend & APIs -->
    <g transform="translate(-95, 0)">
      <rect x="0" y="-16" width="190" height="32" rx="10" fill="url(#pillBackend)" stroke="#6366f1" stroke-width="1.2"/>
      <!-- Server / API Mini Vector Icon -->
      <rect x="18" y="-7" width="11" height="4" rx="1" fill="#818CF8"/>
      <rect x="18" y="-1" width="11" height="4" rx="1" fill="#818CF8"/>
      <rect x="18" y="5" width="11" height="4" rx="1" fill="#818CF8"/>
      <circle cx="26" cy="-5" r="0.8" fill="#030712"/>
      <circle cx="26" cy="1" r="0.8" fill="#030712"/>
      <circle cx="26" cy="7" r="0.8" fill="#030712"/>
      <text x="107" y="4.5" fill="#E0E7FF" class="pill-label" text-anchor="middle">Node • Express • Django</text>
    </g>

    <!-- Badge 3: ERP / Odoo -->
    <g transform="translate(115, 0)">
      <rect x="0" y="-16" width="175" height="32" rx="10" fill="url(#pillErp)" stroke="#9333ea" stroke-width="1.2"/>
      <!-- Module Blocks Icon -->
      <rect x="18" y="-6" width="5" height="5" rx="1" fill="#C084FC"/>
      <rect x="25" y="-6" width="5" height="5" rx="1" fill="#C084FC" opacity="0.6"/>
      <rect x="18" y="1" width="5" height="5" rx="1" fill="#C084FC" opacity="0.6"/>
      <rect x="25" y="1" width="5" height="5" rx="1" fill="#C084FC"/>
      <text x="98" y="4.5" fill="#F3E8FF" class="pill-label" text-anchor="middle">Odoo ERP • PostgreSQL</text>
    </g>
  </g>
</svg>
