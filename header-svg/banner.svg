<svg width="100%" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Deep Space Background -->
    <linearGradient id="bgDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020510"/>
      <stop offset="40%"  stop-color="#060B1C"/>
      <stop offset="75%"  stop-color="#0D0620"/>
      <stop offset="100%" stop-color="#020510"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>

    <!-- Animated Hero Name Gradient (shimmer) -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="300%" y2="0%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="20%"  stop-color="#818CF8"/>
      <stop offset="40%"  stop-color="#E879F9"/>
      <stop offset="60%"  stop-color="#38BDF8"/>
      <stop offset="80%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-2 0; 2 0; -2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%"  stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pillB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pillC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Laser Sweep Gradient -->
    <linearGradient id="laserTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#E879F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserBot" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#E879F9" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#E879F9" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan"   x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glowPink"   x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="textGlow"   x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <style>
    .name      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 46px; font-weight: 900; letter-spacing: 6px; }
    .subtitle  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: #94A3B8; letter-spacing: 1.2px; }
    .status    { font-family: "SF Mono","Fira Code",monospace; font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; fill: #34D399; }
    .pill-lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
    .code-dec  { font-family: "SF Mono","Fira Code",monospace; font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="960" height="300" rx="22" fill="url(#bgDeep)"/>
  <rect width="960" height="300" rx="22" fill="url(#cyberGrid)"/>

  <!-- ═══ AMBIENT GLOWS ═══ -->
  <circle cx="170" cy="90" r="120" fill="#06B6D4" opacity="0.22" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.14;0.28;0.14" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx"      values="170;200;170"    dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="210" r="140" fill="#8B5CF6" opacity="0.22" filter="url(#glowPurple)">
    <animate attributeName="opacity" values="0.16;0.30;0.16" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx"      values="790;755;790"    dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="150" r="80" fill="#EC4899" opacity="0.10" filter="url(#glowPink)">
    <animate attributeName="opacity" values="0.05;0.16;0.05" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ FLOATING SPARKLE NODES ═══ -->
  <circle cx="88"  cy="72"  r="2.5" fill="#38BDF8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="62"  r="2.5" fill="#E879F9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/><animate attributeName="r" values="2;3.8;2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="852" cy="238" r="2"   fill="#34D399"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="108" cy="232" r="2"   fill="#818CF8"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="26"  r="1.5" fill="#38BDF8"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="2s"/></circle>
  <circle cx="480" cy="274" r="1.5" fill="#E879F9"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="2s"/></circle>

  <!-- ═══ GLASSMORPHIC CARD ═══ -->
  <rect x="24" y="16" width="912" height="268" rx="18" fill="url(#glassCard)" stroke="url(#borderGlow)" stroke-width="1.4"/>

  <!-- ═══ LASER SCAN LINES ═══ -->
  <line x1="24"  y1="16.6" x2="224"  y2="16.6" stroke="url(#laserTop)" stroke-width="2.5">
    <animate attributeName="x1" values="24;712;24"   dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="224;912;224" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="736" y1="283.4" x2="936" y2="283.4" stroke="url(#laserBot)" stroke-width="2.5">
    <animate attributeName="x1" values="736;48;736"   dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="936;248;936" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- ═══ CORNER BRACKETS ═══ -->
  <path d="M 38 34 L 38 26 L 48 26"  stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 922 34 L 922 26 L 912 26" stroke="#E879F9" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 38 266 L 38 274 L 48 274" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 922 266 L 922 274 L 912 274" stroke="#E879F9" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- ═══ CODE DECORATORS ═══ -->
  <text x="52"  y="56"  class="code-dec">&lt;dev&gt;</text>
  <text x="908" y="274" class="code-dec" text-anchor="end">&lt;/dev&gt;</text>

  <!-- ═══ LIVE STATUS PILL ═══ -->
  <g transform="translate(480, 50)">
    <rect x="-96" y="-14" width="192" height="28" rx="14" fill="#050A14" stroke="#1E293B" stroke-width="1.2"/>
    <!-- Pulsing live dot -->
    <circle cx="-73" cy="0" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="r"       values="3.5;5.5;3.5" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4.5" class="status" text-anchor="middle">AVAILABLE FOR HIRE</text>
  </g>

  <!-- ═══ HERO NAME (with text glow) ═══ -->
  <!-- Glow shadow layer -->
  <text x="480" y="128" class="name" fill="#38BDF8" opacity="0.25" text-anchor="middle" filter="url(#textGlow)">ANURAG TIWARI</text>
  <!-- Gradient text layer -->
  <text x="480" y="128" class="name" fill="url(#shimmerGrad)" text-anchor="middle">ANURAG TIWARI</text>

  <!-- ═══ ROLE SUBTITLE ═══ -->
  <text x="480" y="162" class="subtitle" text-anchor="middle">
    Mobile App Developer (Flutter · iOS · Android) &amp; Backend Engineer
  </text>

  <!-- ═══ FLOATING TECH BADGE PILLS ═══ -->
  <g transform="translate(480, 220)">

    <!-- Mobile Dev Pill -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-300,-3; -300,3; -300,-3" dur="3.4s" repeatCount="indefinite"/>
      <rect x="0" y="-18" width="188" height="36" rx="12" fill="url(#pillA)" stroke="#0284c7" stroke-width="1.3"/>
      <!-- Phone icon path -->
      <rect x="16" y="-9" width="12" height="18" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
      <line x1="19" y1="6" x2="25" y2="6" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round"/>
      <text x="109" y="5" fill="#BAE6FD" class="pill-lbl" text-anchor="middle">Flutter · iOS · Android</text>
    </g>

    <!-- Backend Pill -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-96,3; -96,-3; -96,3" dur="3.8s" repeatCount="indefinite"/>
      <rect x="0" y="-18" width="193" height="36" rx="12" fill="url(#pillB)" stroke="#6366f1" stroke-width="1.3"/>
      <!-- Server stack icon -->
      <rect x="16" y="-9"   width="13" height="5" rx="1.5" fill="none" stroke="#818CF8" stroke-width="1.3"/>
      <rect x="16" y="-2.5" width="13" height="5" rx="1.5" fill="none" stroke="#818CF8" stroke-width="1.3"/>
      <rect x="16" y="4"    width="13" height="5" rx="1.5" fill="none" stroke="#818CF8" stroke-width="1.3"/>
      <circle cx="26" cy="-6.5" r="0.9" fill="#38BDF8"/>
      <circle cx="26" cy="0"    r="0.9" fill="#38BDF8"/>
      <circle cx="26" cy="6.5"  r="0.9" fill="#38BDF8"/>
      <text x="110" y="5" fill="#E0E7FF" class="pill-lbl" text-anchor="middle">Node · Express · Django</text>
    </g>

    <!-- DB/ERP Pill -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="105,-3; 105,3; 105,-3" dur="3.6s" repeatCount="indefinite"/>
      <rect x="0" y="-18" width="188" height="36" rx="12" fill="url(#pillC)" stroke="#10b981" stroke-width="1.3"/>
      <!-- DB cylinder icon -->
      <ellipse cx="24" cy="-5" rx="6.5" ry="2.8" fill="none" stroke="#34D399" stroke-width="1.4"/>
      <path d="M 17.5 -5 L 17.5 2 C 17.5 3.6 20.4 5 24 5 C 27.6 5 30.5 3.6 30.5 2 L 30.5 -5" stroke="#34D399" stroke-width="1.4" fill="none"/>
      <path d="M 17.5 2 L 17.5 8 C 17.5 9.6 20.4 11 24 11 C 27.6 11 30.5 9.6 30.5 8 L 30.5 2" stroke="#34D399" stroke-width="1.3" fill="none"/>
      <text x="107" y="5" fill="#D1FAE5" class="pill-lbl" text-anchor="middle">Postgres · Odoo ERP</text>
    </g>

  </g>

</svg>
