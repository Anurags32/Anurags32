<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="odooBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#190e24"/>
      <stop offset="100%" stop-color="#080714"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="erpGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#714B67" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <linearGradient id="odooGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#714B67"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#714B67" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#odooBg)" stroke="#714B67" stroke-width="2" stroke-opacity="0.5"/>
  <rect width="400" height="400" rx="24" fill="url(#erpGrid)"/>

  <!-- Central Platform -->
  <ellipse cx="200" cy="315" rx="140" ry="40" fill="#714B67" fill-opacity="0.2" filter="url(#shadow)"/>
  <ellipse cx="200" cy="310" rx="110" ry="28" fill="#06B6D4" fill-opacity="0.15"/>

  <!-- Connection Circuit Lines with Flowing Dash Animation -->
  <g stroke-linecap="round">
    <path d="M 135 100 Q 160 140 170 140" stroke="#06B6D4" stroke-width="2.5" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 265 100 Q 240 140 230 140" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 135 275 Q 170 260 180 230" stroke="#10b981" stroke-width="2.5" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 265 275 Q 230 260 220 230" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Central Odoo Core Hub -->
  <g transform="translate(140, 110)">
    <animateTransform attributeName="transform" type="translate" values="140,110; 140,102; 140,110" dur="4s" repeatCount="indefinite"/>
    <rect width="120" height="120" rx="22" fill="url(#odooGlow)" filter="url(#shadow)" stroke="#f3e8ff" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="60" cy="60" r="42" fill="#ffffff" fill-opacity="0.1"/>
    <text x="60" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">odoo</text>
    <text x="60" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3e8ff" text-anchor="middle">ERP CORE</text>
  </g>

  <!-- Module 1: Inventory & Supply -->
  <g transform="translate(45, 60)">
    <animateTransform attributeName="transform" type="translate" values="45,60; 45,68; 45,60" dur="3.5s" repeatCount="indefinite"/>
    <rect width="90" height="70" rx="14" fill="#1e1b4b" stroke="#06B6D4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">📦</text>
    <text x="45" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Inventory</text>
  </g>

  <!-- Module 2: CRM & Sales -->
  <g transform="translate(265, 60)">
    <animateTransform attributeName="transform" type="translate" values="265,60; 265,52; 265,60" dur="3.8s" repeatCount="indefinite"/>
    <rect width="90" height="70" rx="14" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">📈</text>
    <text x="45" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">CRM &amp; Sales</text>
  </g>

  <!-- Module 3: Accounting / Custom ORM -->
  <g transform="translate(45, 250)">
    <animateTransform attributeName="transform" type="translate" values="45,250; 45,242; 45,250" dur="4.2s" repeatCount="indefinite"/>
    <rect width="90" height="70" rx="14" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">⚙️</text>
    <text x="45" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Python / ORM</text>
  </g>

  <!-- Module 4: PostgreSQL & Reports -->
  <g transform="translate(265, 250)">
    <animateTransform attributeName="transform" type="translate" values="265,250; 265,258; 265,250" dur="3.6s" repeatCount="indefinite"/>
    <rect width="90" height="70" rx="14" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">🐘</text>
    <text x="45" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Floating Status Badge -->
  <g transform="translate(130, 350)">
    <rect width="140" height="28" rx="14" fill="#030712" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="20" cy="14" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">Custom Modules</text>
  </g>
</svg>
