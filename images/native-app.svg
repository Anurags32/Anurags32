<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nativeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c1936"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="kotlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#C711E1"/>
    </linearGradient>
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA7343"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7F52FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#nativeBg)" stroke="#7F52FF" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Glowing Grid Background -->
  <path d="M 50 100 L 350 100 M 50 200 L 350 200 M 50 300 L 350 300 M 100 50 L 100 350 M 200 50 L 200 350 M 300 50 L 300 350" stroke="#7F52FF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Central Dual Phone Mockups -->
  <!-- Android Device Mockup -->
  <g transform="translate(80, 70)" filter="url(#cardShadow)">
    <rect width="110" height="210" rx="20" fill="url(#phoneGrad)" stroke="#3DDC84" stroke-width="2">
      <animate attributeName="y" values="0;-6;0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Screen content -->
    <rect x="10" y="20" width="90" height="170" rx="10" fill="#030712"/>
    <circle cx="55" cy="12" r="3" fill="#3DDC84"/>
    <!-- App UI Mockup -->
    <rect x="20" y="32" width="70" height="24" rx="6" fill="#3DDC84" fill-opacity="0.25"/>
    <text x="55" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#3DDC84" text-anchor="middle">Android</text>
    <rect x="20" y="66" width="70" height="40" rx="6" fill="#1f2937"/>
    <circle cx="35" cy="86" r="10" fill="url(#kotlinGrad)"/>
    <rect x="52" y="78" width="30" height="6" rx="3" fill="#9ca3af"/>
    <rect x="52" y="88" width="22" height="5" rx="2" fill="#4b5563"/>
    <rect x="20" y="114" width="70" height="28" rx="6" fill="#1f2937"/>
    <rect x="20" y="150" width="70" height="28" rx="6" fill="#1f2937"/>
  </g>

  <!-- iOS Device Mockup -->
  <g transform="translate(210, 85)" filter="url(#cardShadow)">
    <rect width="110" height="210" rx="22" fill="url(#phoneGrad)" stroke="#FA7343" stroke-width="2">
      <animate attributeName="y" values="0;6;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Dynamic Island / Notch -->
    <rect x="10" y="20" width="90" height="170" rx="12" fill="#030712"/>
    <rect x="42" y="25" width="26" height="8" rx="4" fill="#111827"/>
    <!-- App UI Mockup -->
    <rect x="20" y="42" width="70" height="24" rx="6" fill="#FA7343" fill-opacity="0.25"/>
    <text x="55" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FA7343" text-anchor="middle">iOS / Swift</text>
    <rect x="20" y="74" width="70" height="42" rx="6" fill="#1f2937"/>
    <circle cx="35" cy="95" r="10" fill="url(#swiftGrad)"/>
    <rect x="52" y="88" width="30" height="6" rx="3" fill="#9ca3af"/>
    <rect x="52" y="98" width="20" height="5" rx="2" fill="#4b5563"/>
    <rect x="20" y="124" width="70" height="28" rx="6" fill="#1f2937"/>
    <rect x="20" y="160" width="70" height="20" rx="6" fill="#1f2937"/>
  </g>

  <!-- Floating Tech Badges -->
  <!-- Kotlin Badge -->
  <g transform="translate(30, 290)">
    <rect width="100" height="32" rx="16" fill="#1e1b4b" stroke="#7F52FF" stroke-width="1.5">
      <animate attributeName="y" values="0;4;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">Kotlin • Android</text>
  </g>

  <!-- Swift Badge -->
  <g transform="translate(270, 290)">
    <rect width="100" height="32" rx="16" fill="#1e1b4b" stroke="#FA7343" stroke-width="1.5">
      <animate attributeName="y" values="0;-4;0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">Swift • iOS</text>
  </g>

  <!-- Floating Status Badge -->
  <g transform="translate(130, 350)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="20" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Native Architecture</text>
  </g>
</svg>
